name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: SwiftLint
        run: brew install swiftlint && swiftlint lint MagicCoffee
      - name: Build and test
        run: |
          xcodebuild test \
            -project MagicCoffee.xcodeproj \
            -scheme MagicCoffee \
            -destination 'platform=iOS Simulator,name=iPhone 16'
